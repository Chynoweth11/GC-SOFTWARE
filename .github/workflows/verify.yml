name: Verify

# Everything that proves the figures are right, run on every push.
#
# The suite already existed and was only ever run by hand, which meant a
# regression was caught when somebody happened to look. Three jobs run in
# parallel so a broken formula is reported in a couple of minutes rather than
# behind a browser walk that takes ten.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # A database of its own per job, built from the migrations and the workbook
  # seed. Never the committed one, because there isn't one.
  DATABASE_URL: file:./prisma/ci.db

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  figures:
    name: Figures, exports, audit and backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the database from the migrations and seed it
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          # Twice. The second run resets a database that already has everything
          # in it, which is the case a seed actually meets and the one that
          # catches a delete ordered before the rows that point at it.
          npx tsx prisma/seed.ts
      # Every identity the engine claims, against live data.
      - run: npm run verify:figures
      # Every workbook and PDF written, reparsed and checked.
      - run: npm run verify:exports
      # The audit log refusing to be edited or deleted.
      - run: npm run verify:audit
      # Every project exported, restored, exported again and compared.
      - run: npm run verify:backup

  postgres:
    name: The same figures on Postgres
    runs-on: ubuntu-latest
    # SQLite is the default and is genuinely enough for one office on one
    # machine. Postgres is what a company with more than one person saving at a
    # time should be on, so the same engines and the same identities are checked
    # against it rather than assumed to carry across.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: constructx
          POSTGRES_PASSWORD: constructx
          POSTGRES_DB: constructx
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://constructx:constructx@127.0.0.1:5432/constructx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the derived Postgres schema is in step with the source one
        run: |
          node scripts/postgres-schema.mjs
          git diff --exit-code prisma/postgres/schema.prisma \
            || (echo "prisma/postgres/schema.prisma is stale. Run node scripts/postgres-schema.mjs and commit it." && exit 1)
      - name: Build the database from the migrations and seed it
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          # Twice, for the same reason as the SQLite job: a reset has to work
          # from a full database, not only from an empty one.
          npx tsx prisma/seed.ts
      - run: npm run verify:figures
      - run: npm run verify:exports
      - run: npm run verify:audit
      - run: npm run verify:backup

  browser:
    name: Every route and every control
    runs-on: ubuntu-latest
    env:
      # The attachment store refuses an unnamed directory in production rather
      # than writing signed contracts somewhere nobody is backing up, so the
      # production server this job starts is told where they go.
      FILE_STORAGE_DIR: ${{ github.workspace }}/var/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the database from the migrations and seed it
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the server
        run: |
          npm run start &
          # Wait for it rather than sleeping: a cold start is slower on a
          # shared runner than on a laptop, and a fixed sleep would report
          # that as a broken app.
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then exit 0; fi
            sleep 2
          done
          echo "The server did not come up." >&2
          exit 1
      # Every route renders, with no console error and no em dash.
      - run: npm run verify:pages
      # Every control does something, and the money rules hold end to end.
      - run: npm run verify:ui
